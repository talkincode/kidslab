<!doctype html>
<html lang="zh-CN" data-theme="light">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>🏗️ 小小金字塔 · KidsLab</title>
  <link rel="stylesheet" href="style.css" />
  <script src="../../scripts/sdk/core.js" data-kidslab-sdk></script>
</head>
<body>
  <header class="bar">
    <a class="pill pill--back" id="backBtn" href="../../index.html" aria-label="返回平台">← <span class="back-word" data-t="back">返回平台</span></a>
    <h1 class="bar__title">🏗️ <span data-t="title">小小金字塔</span></h1>
    <div class="bar__actions">
      <button class="pill pill--icon" id="soundBtn" type="button" aria-label="关闭声音" aria-pressed="false">🔊</button>
      <button class="pill pill--icon" id="themeBtn" type="button" aria-label="切换主题">🌙</button>
      <button class="pill pill--lang" id="langBtn" type="button">EN</button>
    </div>
  </header>

  <main class="wrap">
    <section class="mission-strip" aria-label="工程进度">
      <div class="mission-intro">
        <p class="eyebrow" data-t="eyebrow">法老的工程订单</p>
        <p class="tip" id="tip">给石块选一件省力神器。</p>
      </div>
      <ol class="route" id="route" aria-label="工程关卡"></ol>
    </section>

    <section class="game-shell">
      <section class="stage-card" aria-labelledby="stageLabel">
        <div class="stage-label" id="stageLabel">金字塔工地</div>
        <canvas id="pyramidCanvas" aria-label="金字塔简单机械动画"></canvas>
        <div class="scene-badge" id="sceneBadge" aria-live="polite"></div>
      </section>

      <section class="control-card" aria-labelledby="missionTitle">
        <div class="mission-copy">
          <p class="step-count" id="stepCount">订单 1 / 3</p>
          <h2 id="missionTitle">让巨石走上斜坡</h2>
          <p id="missionText">选一条够长的坡道，别让工人用力超过 4 格。</p>
        </div>

        <div class="readout" id="readout" aria-label="机械读数">
          <div><span data-t="forceLabel">需要的力量</span><strong id="forceValue">—</strong></div>
          <div><span data-t="distanceLabel">要拉的距离</span><strong id="distanceValue">—</strong></div>
          <div><span data-t="workLabel">搬运工作量</span><strong id="workValue">—</strong></div>
        </div>

        <div class="control-zone" id="controlZone"></div>
        <p class="feedback" id="status" role="status" aria-live="polite"></p>
        <div class="control-foot">
          <button class="text-btn" id="hintBtn" type="button" aria-expanded="false">💡 <span data-t="hint">给我一点提示</span></button>
          <button class="text-btn" id="resetBtn" type="button">↻ <span data-t="reset">重新规划</span></button>
        </div>
      </section>
    </section>
  </main>

  <div class="celebration" id="celebration" hidden>
    <section class="certificate" role="dialog" aria-modal="true" aria-labelledby="certTitle">
      <div class="seal" aria-hidden="true">△</div>
      <p class="eyebrow" data-t="certEyebrow">工程总监认证</p>
      <h2 id="certTitle" data-t="certTitle">金字塔竣工啦！</h2>
      <p data-t="certText">你让石块变得省力，却没有把工作量变没：路和绳子替你变长了。</p>
      <button class="primary" id="againBtn" type="button" data-t="again">再盖一座</button>
    </section>
  </div>

  <script type="module" src="main.js"></script>
</body>
</html>
