<!doctype html>
<html lang="zh-CN" data-theme="light">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>🎈 空气车库 · KidsLab</title>
  <link rel="stylesheet" href="style.css" />
  <script src="../../scripts/sdk/core.js" data-kidslab-sdk></script>
</head>
<body>
  <header class="bar">
    <a class="pill pill--back" id="backBtn" href="../../index.html" aria-label="返回平台">← <span class="back-word" data-t="back">返回平台</span></a>
    <h1 class="bar__title">🎈 <span data-t="title">空气车库</span></h1>
    <div class="bar__actions">
      <button class="pill pill--icon" id="soundBtn" type="button" aria-label="关闭声音" aria-pressed="false">🔊</button>
      <button class="pill pill--icon" id="themeBtn" type="button" aria-label="切换主题">🌙</button>
      <button class="pill pill--lang" id="langBtn" type="button">EN</button>
    </div>
  </header>

  <main class="wrap">
    <section class="mission-strip" aria-label="车间进度">
      <div class="mission-intro">
        <p class="eyebrow" data-t="eyebrow">只烧空气的改装车间</p>
        <p class="tip" id="tip">扣进水里，看看纸巾会不会湿。</p>
      </div>
      <ol class="route" id="route" aria-label="实验工位"></ol>
    </section>

    <section class="game-shell">
      <section class="stage-card" aria-labelledby="stageLabel">
        <div class="stage-label" id="stageLabel">纸巾潜水</div>
        <canvas id="garageCanvas" aria-label="空气实验动画"></canvas>
        <div class="scene-badge" id="sceneBadge" aria-live="polite"></div>
      </section>

      <section class="control-card" aria-labelledby="missionTitle">
        <div class="mission-copy">
          <p class="step-count" id="stepCount">工位 1 / 3</p>
          <h2 id="missionTitle">把杯子竖直扣进水里</h2>
          <p id="missionText">杯底有一张纸巾。把它扣进水里。</p>
        </div>

        <div class="readout" id="readout" aria-label="实验读数">
          <div><span id="readLabelA">纸巾</span><strong id="readValueA">干燥</strong></div>
          <div><span id="readLabelB">杯子</span><strong id="readValueB">在水面</strong></div>
          <div><span id="readLabelC">发现</span><strong id="readValueC">还没试</strong></div>
        </div>

        <div class="control-zone" id="controlZone"></div>
        <p class="feedback" id="status" role="status" aria-live="polite"></p>
        <div class="control-foot">
          <button class="text-btn" id="hintBtn" type="button" aria-expanded="false">💡 <span data-t="hint">给我一点提示</span></button>
          <button class="text-btn" id="resetBtn" type="button">↻ <span data-t="reset">这一关重来</span></button>
        </div>
      </section>
    </section>
  </main>

  <div class="celebration" id="celebration" hidden>
    <section class="certificate" role="dialog" aria-modal="true" aria-labelledby="certTitle">
      <div class="seal" aria-hidden="true">🎈</div>
      <p class="eyebrow" data-t="certEyebrow">空气技师认证</p>
      <h2 id="certTitle" data-t="certTitle">空气车库通关啦！</h2>
      <p data-t="certText">看不见的空气会占地方、有重量，还能把车子推过终点。</p>
      <button class="primary" id="againBtn" type="button" data-t="again">再开一间车库</button>
    </section>
  </div>

  <script type="module" src="main.js"></script>
</body>
</html>
