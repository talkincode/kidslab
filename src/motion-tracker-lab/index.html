<!doctype html>
<html lang="zh-CN" data-theme="light">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>运动追踪实验室 · KidsLab</title>
  <link rel="stylesheet" href="style.css" />
  <script type="importmap">{ "imports": { "three": "./vendor/three.module.min.js" } }</script>
  <script src="../../scripts/sdk/core.js" data-kidslab-sdk></script>
</head>
<body>
  <canvas id="stage" aria-label="3D 运动轨道"></canvas>
  <div id="app" hidden data-mobile-panel="film"></div>

  <header class="bar">
    <a class="pill" href="../../index.html">← <span data-t="back">返回平台</span></a>
    <h1 class="bar__title">🎬 <span data-t="title">运动追踪实验室</span></h1>
    <div class="bar__actions">
      <button class="pill pill--icon" id="soundBtn" type="button" aria-pressed="false" aria-label="关闭声音">🔊</button>
      <button class="pill pill--icon" id="themeBtn" type="button" aria-label="切换主题">🌙</button>
      <button class="pill" id="langBtn" type="button">EN</button>
    </div>
  </header>

  <section class="hud">
    <div class="hud__chip"><span class="hud__label">CLIP</span><b id="missionCode">01</b></div>
    <div class="hud__chip"><span class="hud__label">t</span><b id="timeReadout">0.00 s</b></div>
    <div class="hud__chip"><span class="hud__label">θ</span><b id="angleReadout">0°</b></div>
  </section>
  <span id="frameReadout" hidden>1 / 6</span>

  <div class="coach">
    <span class="coach__icon">◎</span>
    <div>
      <b id="filmTitle" data-t="filmTitle">这段录像里，小车速度在变吗？</b>
      <p id="tip" data-t="tip0">点小车，给这一帧打点</p>
      <p id="filmFeedback"></p>
    </div>
  </div>

  <aside class="panel" id="panel">
    <div class="panel__quick">
      <button class="btn btn--big" id="markBtn" type="button" data-t="mark">给这一帧打点</button>
      <div class="btnrow">
        <button class="btn btn--ghost" id="resetBtn" type="button" data-t="reset">重拍这一段</button>
      </div>
    </div>
    <button class="panel__handle" id="panelHandle" type="button" aria-expanded="true">
      <span data-t="panelTitle">观测台</span><i id="panelArrow">▾</i>
    </button>
    <div class="panel__body" id="panelBody">
      <section class="panel__group">
        <p class="panel__label" data-t="predictionTitle">你看到速度在变吗？</p>
        <div class="seg">
          <button class="seg__btn" type="button" data-prediction="steady" data-t="predSteady">速度不变</button>
          <button class="seg__btn" type="button" data-prediction="changing" data-t="predChanging">速度在变</button>
        </div>
      </section>

      <section class="panel__group">
        <p class="panel__label"><span data-t="dataTitle">点变成图</span><b id="markCount" class="panel__val">0 / 6</b></p>
        <p class="panel__hint" id="graphHint" data-t="graphEmpty">打出两个点，图就会开始长出来。</p>
        <div class="table-wrap">
          <table>
            <thead><tr><th>n</th><th>t / s</th><th>s / m</th><th>v</th></tr></thead>
            <tbody id="recordBody"></tbody>
          </table>
        </div>
        <svg class="evidence-graph" viewBox="0 0 220 140" aria-label="s-t"><g class="graph-grid"><path d="M36 12V112H204 M36 87H204 M36 62H204 M36 37H204 M36 12H204"></path></g><path class="graph-fit" id="stFit" d=""></path><g id="stPoints"></g></svg>
        <svg class="evidence-graph" viewBox="0 0 220 140" aria-label="v-t"><g class="graph-grid"><path d="M36 12V112H204 M36 87H204 M36 62H204 M36 37H204 M36 12H204"></path></g><path class="graph-fit" id="vtFit" d=""></path><g id="vtPoints"></g></svg>
        <p class="panel__hint" id="slopeLine"></p>
      </section>

      <section class="panel__group">
        <p class="panel__label" data-t="labTitle">对照图像</p>
        <div class="seg">
          <button class="seg__btn" id="uniformBtn" type="button" data-kind="uniform" data-t="kindUniform">匀速</button>
          <button class="seg__btn" id="accelBtn" type="button" data-kind="accelerated" data-t="kindAccel">匀加速</button>
        </div>
        <div id="designCard" hidden>
          <p class="panel__label" data-t="designTitle">自己选坡度</p>
          <div class="seg">
            <button class="seg__btn" type="button" data-angle="10">10°</button>
            <button class="seg__btn" type="button" data-angle="20">20°</button>
            <button class="seg__btn" type="button" data-angle="30">30°</button>
          </div>
          <p class="panel__hint" data-t="lawPrompt">测出的斜率更接近哪一条？</p>
          <div class="seg">
            <button class="seg__btn" type="button" data-law="sin">a = g sinθ</button>
            <button class="seg__btn" type="button" data-law="cos">a = g cosθ</button>
            <button class="seg__btn" type="button" data-law="g">a = g</button>
          </div>
        </div>
        <p id="formulaStrip" class="panel__hint" hidden></p>
        <p id="labFeedback" class="panel__hint"></p>
        <p id="conclusionStatus" class="observe-card" hidden></p>
      </section>
    </div>
  </aside>
  <p class="foot-tip" data-t="footTip">点橙色小车打点 · 拖空白转视角</p>
  <script type="module" src="main.js"></script>
</body>
</html>
