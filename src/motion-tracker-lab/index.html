<!doctype html>
<html lang="zh-CN" data-theme="light">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="description" content="在气垫导轨上给小车打点，看 s-t、v-t 图自己长出来，比较匀速和斜面匀加速。" />
  <meta name="color-scheme" content="light dark" />
  <title>运动追踪实验室 · KidsLab</title>
  <link rel="stylesheet" href="style.css" />
  <script type="importmap">{ "imports": { "three": "./vendor/three.module.min.js" } }</script>
  <script src="../../scripts/sdk/core.js" data-kidslab-sdk></script>
</head>
<body>
  <canvas id="stage" aria-label="3D 气垫导轨"></canvas>
  <p class="nogl" id="nogl" hidden>
    <strong data-t="noglTitle">这台设备暂时不能显示 3D 轨道</strong>
    <span data-t="noglText">可以继续用面板打点看图；换一个支持 WebGL 的浏览器会更清楚。</span>
  </p>
  <div id="app" hidden></div>

  <header class="bar">
    <a class="pill" href="../../index.html">← <span data-t="back">返回平台</span></a>
    <h1 class="bar__title">🎬 <span data-t="title">运动追踪实验室</span></h1>
    <div class="bar__actions">
      <button class="pill pill--icon" id="musicBtn" type="button" aria-pressed="false" aria-label="关闭音乐">♫</button>
      <button class="pill pill--icon" id="soundBtn" type="button" aria-pressed="false" aria-label="关闭音效">🔊</button>
      <button class="pill pill--icon" id="themeBtn" type="button" aria-label="切换主题">🌙</button>
      <button class="pill" id="langBtn" type="button">EN</button>
    </div>
  </header>

  <section class="hud" aria-label="live instruments">
    <div class="hud__chip"><span class="hud__label" data-t="hudTime">时间 t</span><b id="timeReadout">0.00 s</b></div>
    <div class="hud__chip"><span class="hud__label" data-t="hudS">路程 s</span><b id="sReadout">0.10 m</b></div>
    <div class="hud__chip"><span class="hud__label" data-t="hudV">速度 v</span><b id="vReadout">0.40 m/s</b></div>
  </section>

  <div class="coach">
    <span class="coach__icon">◎</span>
    <div>
      <b id="filmTitle" data-t="coachTitle">小车是匀速，还是越跑越快？</b>
      <p id="tip" data-t="tip0">按播放看它跑，或打点让图自己长出来</p>
    </div>
  </div>

  <div class="view-dock" role="group" aria-label="观察视角">
    <button class="view-btn is-active" type="button" data-view="stage" aria-pressed="true"><span data-t="viewStage">斜视</span></button>
    <button class="view-btn" type="button" data-view="side" aria-pressed="false"><span data-t="viewSide">侧面</span></button>
    <button class="view-btn" type="button" data-view="top" aria-pressed="false"><span data-t="viewTop">俯视</span></button>
  </div>

  <aside class="panel" id="panel">
    <div class="panel__quick">
      <button class="btn btn--big" id="playBtn" type="button" data-t="play">播放</button>
      <div class="btnrow">
        <button class="btn btn--ghost" id="markBtn" type="button" data-t="mark">给这一帧打点</button>
        <button class="btn btn--ghost" id="resetBtn" type="button" data-t="reset">重新实验</button>
      </div>
    </div>
    <button class="panel__handle" id="panelHandle" type="button" aria-expanded="true">
      <span data-t="panelTitle">观测台</span><i id="panelArrow">▾</i>
    </button>
    <div class="panel__body" id="panelBody">
      <section class="panel__group">
        <p class="panel__label" data-t="trackTitle">这一次怎么跑</p>
        <div class="seg">
          <button class="seg__btn is-on" id="uniformBtn" type="button" data-kind="uniform" data-t="kindUniform">水平匀速</button>
          <button class="seg__btn" id="accelBtn" type="button" data-kind="accelerated" data-t="kindAccel">斜面加速</button>
        </div>
        <div id="angleRow" hidden>
          <p class="panel__label" data-t="angleTitle">斜面有多陡</p>
          <div class="seg">
            <button class="seg__btn" type="button" data-angle="10">10°</button>
            <button class="seg__btn is-on" type="button" data-angle="20">20°</button>
            <button class="seg__btn" type="button" data-angle="30">30°</button>
          </div>
        </div>
      </section>

      <section class="panel__group">
        <p class="panel__label"><span data-t="dataTitle">点变成图</span><b id="markCount" class="panel__val">0 / 8</b></p>
        <p class="panel__hint" id="graphHint" data-t="graphEmpty">打出两个点，图就会开始长出来。</p>
        <p class="graph-caption">s–t</p>
        <svg class="evidence-graph" viewBox="0 0 220 140" aria-label="s-t">
          <g class="graph-grid"><path d="M36 12V112H204 M36 87H204 M36 62H204 M36 37H204 M36 12H204"></path></g>
          <path class="graph-fit" id="stFit" d=""></path>
          <g id="stPoints"></g>
        </svg>
        <p class="graph-caption">v–t</p>
        <svg class="evidence-graph" viewBox="0 0 220 140" aria-label="v-t">
          <g class="graph-grid"><path d="M36 12V112H204 M36 87H204 M36 62H204 M36 37H204 M36 12H204"></path></g>
          <path class="graph-fit" id="vtFit" d=""></path>
          <g id="vtPoints"></g>
        </svg>
        <p class="panel__hint" id="slopeLine"></p>
        <div class="table-wrap">
          <table>
            <thead><tr><th>n</th><th>t / s</th><th>s / m</th><th>v</th></tr></thead>
            <tbody id="recordBody"></tbody>
          </table>
        </div>
      </section>

      <p class="panel__hint" id="observeNote" data-t="speedWords">速度，就是这一小段里小车走了多远、用了多久。</p>
      <p id="filmFeedback" class="panel__hint"></p>
    </div>
  </aside>
  <p class="foot-tip" data-t="footTip">点橙色小车打点 · 拖空白转视角</p>
  <script type="module" src="main.js"></script>
</body>
</html>
