<!doctype html>
<html lang="zh-CN" data-theme="light">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>密度侦探实验室 · KidsLab</title>
  <link rel="stylesheet" href="style.css" />
  <script type="importmap">{ "imports": { "three": "./vendor/three.module.min.js" } }</script>
  <script src="../../scripts/sdk/core.js" data-kidslab-sdk></script>
</head>
<body>
  <canvas id="scene" aria-label="3D 密度实验台"></canvas>
  <p class="nogl" id="nogl" hidden data-t="nogl">浏览器暂不支持 WebGL，请用右侧读数继续观察。</p>

  <header class="bar">
    <a class="pill" href="../../index.html">← <span data-t="back">返回平台</span></a>
    <h1 class="bar__title">⚖️ <span data-t="title">密度侦探实验室</span></h1>
    <div class="bar__actions">
      <button class="pill pill--icon" id="soundBtn" type="button" aria-pressed="false" aria-label="关闭声音">🔊</button>
      <button class="pill pill--icon" id="themeBtn" type="button" aria-label="切换主题">🌙</button>
      <button class="pill" id="langBtn" type="button">EN</button>
    </div>
  </header>

  <section class="hud" aria-label="仪器读数">
    <div class="hud__chip"><span class="hud__label" data-t="massReadout">有多重</span><b id="massReadout">—</b></div>
    <div class="hud__chip"><span class="hud__label" data-t="initialLevel">开始水面</span><b id="initialReading">40.0 mL</b></div>
    <div class="hud__chip"><span class="hud__label" data-t="finalLevel">升高后</span><b id="finalReading">—</b></div>
  </section>

  <div class="coach" id="coach" role="status" aria-live="polite">
    <span class="coach__icon">◎</span>
    <div>
      <b id="selectedSpecimen">小块金属</b>
      <p id="benchFeedback">选一块金属，先放上天平称一称。</p>
    </div>
  </div>

  <aside class="panel" id="panel">
    <div class="panel__quick">
      <div class="btnrow">
        <button class="btn btn--big" id="weighBtn" type="button"><span data-t="weigh">放上天平</span></button>
      </div>
      <div class="btnrow">
        <button class="btn btn--ghost" id="submergeBtn" type="button"><span data-t="submerge">浸没入水</span></button>
        <button class="btn btn--ghost" id="resetBtn" type="button" data-t="reset">重新实验</button>
      </div>
    </div>
    <button class="panel__handle" id="panelHandle" type="button" aria-expanded="true">
      <span data-t="panelTitle">观测台</span><i id="panelArrow">▾</i>
    </button>
    <div class="panel__body" id="panelBody">
      <section class="panel__group">
        <p class="panel__label"><span data-t="specimenTitle">桌上的金属</span><b id="recordCount" class="panel__val">0 / 3</b></p>
        <div class="seg" role="group">
          <button class="seg__btn is-on" type="button" data-specimen="specimen-a"><span data-t="specimenA">小块</span></button>
          <button class="seg__btn" type="button" data-specimen="specimen-b"><span data-t="specimenB">中块</span></button>
          <button class="seg__btn" type="button" data-specimen="specimen-c"><span data-t="specimenC">大块</span></button>
        </div>
        <p class="panel__hint" data-t="specimenHint">三块看起来一样亮，只是大小不同。</p>
      </section>

      <section class="panel__group" id="liveGroup">
        <p class="panel__label" data-t="liveTitle">刚才看到的读数</p>
        <p class="live-read" id="liveReadout">质量 — · 排水体积 —</p>
        <button class="btn btn--big" id="recordBtn" type="button" data-t="record">记入数据表</button>
        <p class="panel__hint" id="entryFeedback"></p>
      </section>

      <section class="panel__group">
        <p class="panel__label"><span data-t="graphTitle">质量对着体积</span><b id="densityEstimate" class="panel__val">—</b></p>
        <svg class="evidence-graph" viewBox="0 0 280 180" role="img" aria-label="质量和体积关系图">
          <g class="graph-grid" aria-hidden="true">
            <path d="M34 18V150H260 M34 117H260 M34 84H260 M34 51H260 M34 18H260 M109 18V150 M184 18V150 M260 18V150"></path>
          </g>
          <path class="graph-fit" id="graphFit" d=""></path>
          <g class="graph-points" id="graphPoints"></g>
        </svg>
        <div class="table-wrap">
          <table>
            <thead>
              <tr>
                <th data-t="tableSpecimen">金属</th>
                <th data-t="tableMass">多重 / g</th>
                <th data-t="tableVolume">多大 / cm³</th>
                <th data-t="tableDensity">挤得有多紧</th>
              </tr>
            </thead>
            <tbody id="recordBody"></tbody>
          </table>
        </div>
      </section>

      <section class="observe-card" id="completeCard" hidden>
        <b id="conclusionStatus"></b>
        <p data-t="densityPlain">同样大的东西，有的轻有的重。这条线有多陡，就是密度。</p>
      </section>

      <p class="panel__hint" data-t="modelNote">教学示意：水面升高的那一截就是金属的体积。1 mL = 1 cm³。</p>
    </div>
  </aside>
  <p class="foot-tip" data-t="footTip">拖空白转视角 · 先称重再浸没 · 点会自己连成线</p>
  <script type="module" src="main.js"></script>
</body>
</html>
