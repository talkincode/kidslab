<!doctype html>
<html lang="zh-CN" data-theme="light">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>三角形实验室 · KidsLab</title>
  <link rel="stylesheet" href="style.css" />
  <script src="../../scripts/sdk/core.js" data-kidslab-sdk></script>
</head>
<body>
  <header class="bar">
    <a class="pill pill--back" href="../../index.html">← <span data-t="back">返回平台</span></a>
    <h1><span aria-hidden="true">🔺</span> <span data-t="title">三角形实验室</span></h1>
    <div class="bar__actions">
      <button class="pill pill--icon" id="soundBtn" type="button" aria-label="关闭声音" aria-pressed="false">🔊</button>
      <button class="pill pill--icon" id="themeBtn" type="button" aria-label="切换主题">🌙</button>
      <button class="pill pill--lang" id="langBtn" type="button">EN</button>
    </div>
  </header>

  <main class="course">
    <section class="mission card">
      <div class="mission__badge" aria-hidden="true"><small>LAB</small><strong id="missionNumber">01</strong></div>
      <div class="mission__copy">
        <p id="missionKicker">实验一 · 结构抗震</p>
        <h2 id="missionTitle">斜撑让货架不再变形</h2>
        <p id="missionText">先放上大象测试方框，再加斜撑重试。</p>
      </div>
      <nav class="mission-nav" id="missionNav" aria-label="实验项目"></nav>
    </section>

    <section class="workspace">
      <section class="stage card">
        <div class="stage__hud">
          <p class="status" id="status" role="status" aria-live="polite">方框看着结实，真的扛得住吗？先放上大象。</p>
          <div class="result-chip"><span data-t="records">记录</span><strong id="recordCount">0/3</strong></div>
        </div>
        <div class="canvas-shell" id="canvasShell">
          <canvas id="labCanvas" aria-label="三角形实验台"></canvas>
          <div class="canvas-label" id="canvasLabel">SQUARE FRAME / 方框货架</div>
          <div class="formula" id="formula" aria-live="polite"></div>
        </div>
      </section>

      <aside class="console card">
        <div class="console__head">
          <div>
            <p id="consoleKicker">STRUCTURE BENCH / 结构台</p>
            <strong id="consoleTitle">让货架经受重量测试</strong>
          </div>
          <span class="console__stamp" id="consoleStamp" aria-hidden="true">01</span>
        </div>

        <section class="lesson-panel">
          <span id="lessonIcon" aria-hidden="true">🏗️</span>
          <p id="lessonText">方框能在边长不变时改变角度；一根斜撑会把它分成两个稳定的三角形。</p>
        </section>

        <section class="controls" id="stabilityControls">
          <button class="action action--primary" id="loadBtn" type="button"><span aria-hidden="true">🐘</span> <span data-t="loadElephant">放上大象</span></button>
          <button class="action" id="braceBtn" type="button"><span aria-hidden="true">🪵</span> <span data-t="addBrace">加一根斜撑</span></button>
        </section>

        <section class="controls" id="angleControls" hidden>
          <button class="action action--primary" id="tearBtn" type="button"><span aria-hidden="true">✂️</span> <span data-t="tearAngles">撕下三个角</span></button>
          <button class="action" id="newTriangleBtn" type="button"><span aria-hidden="true">🔄</span> <span data-t="newTriangle">换个三角形</span></button>
        </section>

        <section class="controls" id="sticksControls" hidden>
          <p class="control-label" data-t="stickQuestion">这三根木条能围成三角形吗？</p>
          <div class="answer-row">
            <button class="answer answer--yes" id="canBuildBtn" type="button"><span aria-hidden="true">△</span><strong data-t="canBuild">能围成</strong></button>
            <button class="answer answer--no" id="cannotBuildBtn" type="button"><span aria-hidden="true">—</span><strong data-t="cannotBuild">围不成</strong></button>
          </div>
        </section>

        <div class="console__actions">
          <button class="secondary" id="hintBtn" type="button"><span aria-hidden="true">💡</span> <span data-t="hint">轻提示</span></button>
          <button class="action action--next" id="nextLabBtn" type="button" hidden><span data-t="nextLab">去下一个实验</span> <span aria-hidden="true">→</span></button>
        </div>
      </aside>
    </section>
  </main>

  <div class="modal" id="completeModal" hidden>
    <section class="modal__card" role="dialog" aria-modal="true" aria-labelledby="completeTitle">
      <div class="trophy" aria-hidden="true">🔺<span>✨</span></div>
      <p data-t="finalKicker">三项实验记录完成</p>
      <h2 id="completeTitle" data-t="finalTitle">三角形专家认证！</h2>
      <p data-t="finalText">你用斜撑造出稳定结构，把三个内角拼成 180°，还找到了木条能围成三角形的严格条件。</p>
      <button class="action action--primary" id="playAgainBtn" type="button" data-t="playAgain">重新做实验</button>
    </section>
  </div>

  <script src="main.js"></script>
</body>
</html>
