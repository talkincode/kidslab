<html lang="zh-CN" data-theme="light">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>荒岛净水师 · KidsLab</title>
  <link rel="stylesheet" href="style.css?v=3e152283" />
  <link rel="icon" type="image/svg+xml" href="../../assets/favicon.svg">

</head>
<body>
  <div class="island-bg" aria-hidden="true">
    <i class="palm"></i>
    <i class="palm palm--2"></i>
    <i class="wave"></i>
    <i class="wave wave--2"></i>
  </div>

  <header class="bar">
    <a class="pill" href="../../index.html">← <span data-t="back">返回平台</span></a>
    <h1 class="bar__title"><span aria-hidden="true">🏝️</span> <span data-t="title">荒岛净水师</span></h1>
    <div class="bar__actions">
      <button class="pill pill--icon" id="soundBtn" type="button" aria-label="关闭声音" aria-pressed="false">🔊</button>
      <button class="pill pill--icon" id="themeBtn" type="button" aria-label="切换主题">🌙</button>
      <button class="pill" id="langBtn" type="button">EN</button>
    </div>
  </header>

  <main class="app">
    <section class="brief card">
      <div class="brief__camp">
        <small data-t="campLabel">营地</small>
        <strong id="campNumber">01</strong>
      </div>
      <div class="brief__copy">
        <p class="eyebrow" id="campKicker">第一营 · 沉淀</p>
        <h2 id="campTitle">这桶浑汤能喝吗？先让泥沙沉下去</h2>
        <p id="status" role="status" aria-live="polite">点「静置」，看沙子自己往下掉。</p>
      </div>
      <div class="meters" aria-label="水质仪">
        <div class="meter">
          <span data-t="turbidity">浊度</span>
          <strong id="turbidityValue">92</strong>
        </div>
        <div class="meter">
          <span data-t="salinity">含盐</span>
          <strong id="salinityValue">78</strong>
        </div>
        <div class="lamp" id="drinkLamp" data-state="off">
          <span class="lamp__dot" aria-hidden="true"></span>
          <strong id="drinkText">还不能喝</strong>
        </div>
      </div>
    </section>

    <nav class="camp-nav" id="campNav" aria-label="净水营地"></nav>

    <section class="workspace">
      <section class="scene card" aria-labelledby="sceneTitle">
        <div class="scene__head">
          <div>
            <p class="section-label" data-t="bucketLabel">荒岛水桶</p>
            <h2 id="sceneTitle" data-t="bucketTitle">眼前这桶浑汤</h2>
          </div>
          <button class="ghost-btn" id="hintBtn" type="button"><span aria-hidden="true">💡</span> <span data-t="hint">轻提示</span></button>
        </div>

        <div class="stage" id="stage">
          <div class="bucket-wrap">
            <div class="bucket" id="bucket" data-look="muddy">
              <div class="bucket__rim" aria-hidden="true"></div>
              <div class="water" id="water">
                <span class="leaf l1" aria-hidden="true">🍃</span>
                <span class="leaf l2" aria-hidden="true">🍂</span>
                <span class="grit" aria-hidden="true"></span>
                <span class="salt" aria-hidden="true"></span>
              </div>
              <div class="sediment" id="sediment" aria-hidden="true"></div>
              <div class="steam" id="steam" hidden></div>
            </div>
            <div class="coconut" id="coconut" hidden>
              <span aria-hidden="true">🥥</span>
              <small id="coconutLabel">冷凝壳</small>
            </div>
          </div>
          <div class="filter" id="filter" data-ready="false">
            <p class="section-label" data-t="filterLabel">沙炭滤瓶</p>
            <div class="filter__stack" id="filterStack"></div>
          </div>
        </div>

        <p class="lesson" id="lessonText" hidden>泥沙会沉，落叶会浮。溶解的盐藏在水里，眼睛看不见。</p>
      </section>

      <aside class="tools card">
        <div class="tools__head">
          <div>
            <p class="section-label" data-t="toolsLabel">岛上材料</p>
            <h2 id="toolsTitle" data-t="toolsTitle">动手净水</h2>
          </div>
          <button class="ghost-btn" id="restartBtn" type="button" data-t="restart">重开一桶</button>
        </div>
        <div class="tool-grid" id="toolGrid"></div>
      </aside>
    </section>
  </main>

  <div class="modal" id="completeModal" hidden>
    <section class="modal__card" role="dialog" aria-modal="true" aria-labelledby="completeTitle">
      <div class="modal__burst" aria-hidden="true">🥥💧☀️</div>
      <p class="modal__kicker" data-t="finalKicker">三营净水完成</p>
      <h2 id="completeTitle" data-t="finalTitle">荒岛亮起可饮用绿灯！</h2>
      <p data-t="finalText">泥沙能沉、能滤；盐溶解后只能靠蒸汽带走淡水。清澈不等于能喝。</p>
      <button class="action" id="playAgainBtn" type="button" data-t="playAgain">再救一桶水</button>
    </section>
  </div>

  <script type="module" src="main.js?v=4be23ce8"></script>
</body>
</html>
