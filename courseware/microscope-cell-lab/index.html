<!doctype html>
<html lang="zh-CN" data-theme="light">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>🔬 显微细胞实验室 · KidsLab</title>
  <!--
    THESIS: A 3D compound microscope bench, not a cell quiz.
    OWN-WORLD: KidsLab chunky pills, fullscreen Three.js stage, right-hand instrument panel.
    STORY: Turn knobs, watch the eyepiece snap from blur to cells, record field diameters.
    FIRST VIEWPORT: Microscope + circular eyepiece view; HUD chips; collapsible panel.
  -->
  <link rel="stylesheet" href="style.css?v=d06b0b58" />
  <script>
    (() => {
      try {
        const theme = localStorage.getItem('kidslab.theme')
          || (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
        const lang = localStorage.getItem('kidslab.lang')
          || (navigator.language && navigator.language.startsWith('zh') ? 'zh' : 'en');
        document.documentElement.dataset.theme = theme;
        document.documentElement.lang = lang === 'zh' ? 'zh-CN' : 'en';
      } catch { /* private mode */ }
    })();
  </script>
  <script type="importmap">
    { "imports": { "three": "./vendor/three.module.min.js" } }
  </script>
<link rel="icon" type="image/svg+xml" href="../../assets/favicon.svg">

</head>
<body>
  <canvas id="scene" aria-label="3D microscope lab"></canvas>
  <p class="nogl" id="nogl" hidden data-t="nogl">浏览器暂时跑不了 3D 实验室，换一个新一点的浏览器再来观测吧。</p>

  <header class="bar">
    <a class="pill" href="../../index.html">← <span data-t="back">返回平台</span></a>
    <h1 class="bar__title">🔬 <span data-t="title">显微细胞实验室</span></h1>
    <div class="bar__actions">
      <button class="pill pill--icon" id="musicBtn" type="button" aria-pressed="true">♫</button>
      <button class="pill pill--icon" id="soundBtn" type="button" aria-pressed="true">🔊</button>
      <button class="pill pill--icon" id="themeBtn" type="button">🌙</button>
      <button class="pill" id="langBtn" type="button">EN</button>
    </div>
  </header>

  <section class="hud" aria-label="live instruments">
    <div class="hud__chip"><span class="hud__label" data-t="hudMag">总放大</span><b id="magVal">40×</b></div>
    <div class="hud__chip"><span class="hud__label" data-t="hudFov">视野直径</span><b id="fovVal">4.50 mm</b></div>
    <div class="hud__chip"><span class="hud__label" data-t="hudSharp">焦点</span><b id="sharpVal">模糊</b></div>
  </section>

  <p class="coach" id="coach" data-t="tip0">先开灯，拧粗准焦，把光斑拧清楚</p>

  <aside class="panel" id="panel">
    <div class="panel__quick">
      <button class="btn btn--big" id="recordBtn" type="button">📝 <span data-t="btnRecord">记下这一视野</span></button>
      <div class="btnrow">
        <button class="btn btn--ghost btn--sm" id="resetBtn" type="button" data-t="btnReset">重新观察</button>
      </div>
      <p class="panel__note" id="feedback" data-t="feedbackIdle">低倍看清再换高倍。高倍只能拧细准焦。</p>
    </div>
    <button class="panel__handle" id="panelHandle" type="button" aria-expanded="true">
      <span data-t="panelTitle">显微镜面板</span><i id="panelArrow">▾</i>
    </button>
    <div class="panel__body" id="panelBody">
      <section class="panel__group">
        <p class="panel__label" data-t="labSlide">装片</p>
        <div class="btnrow">
          <button class="btn btn--ghost btn--sm is-on" id="slideOnion" type="button" aria-pressed="true" data-t="slideOnion">洋葱表皮</button>
          <button class="btn btn--ghost btn--sm" id="slideCheek" type="button" aria-pressed="false" data-t="slideCheek">口腔上皮</button>
        </div>
      </section>
      <section class="panel__group">
        <p class="panel__label" data-t="labObj">物镜</p>
        <div class="btnrow">
          <button class="btn btn--ghost btn--sm is-on" id="obj4" type="button" aria-pressed="true">4×</button>
          <button class="btn btn--ghost btn--sm" id="obj10" type="button" aria-pressed="false">10×</button>
          <button class="btn btn--ghost btn--sm" id="obj40" type="button" aria-pressed="false">40×</button>
        </div>
      </section>
      <section class="panel__group">
        <p class="panel__label"><span data-t="labLight">照明</span><b id="lightVal" class="panel__val">40</b></p>
        <input type="range" id="lightRange" min="0" max="100" step="1" value="40" />
      </section>
      <section class="panel__group">
        <p class="panel__label"><span data-t="labCoarse">粗准焦</span><b id="coarseVal" class="panel__val">−800 μm</b></p>
        <input type="range" id="coarseRange" min="-2000" max="2000" step="20" value="-800" />
      </section>
      <section class="panel__group">
        <p class="panel__label"><span data-t="labFine">细准焦</span><b id="fineVal" class="panel__val">0 μm</b></p>
        <input type="range" id="fineRange" min="-40" max="40" step="1" value="0" />
      </section>
      <section class="panel__group">
        <p class="panel__label" data-t="logTitle">观测记录</p>
        <table class="log-table">
          <thead>
            <tr>
              <th data-t="colSlide">装片</th>
              <th data-t="colMag">放大</th>
              <th data-t="colFov">视野</th>
            </tr>
          </thead>
          <tbody id="trialRows"></tbody>
        </table>
      </section>
      <section class="panel__group" id="completeCard" hidden>
        <p class="panel__note" id="conclusionStatus">换更高倍，视野变小；洋葱有壁，口腔上皮没有。</p>
      </section>
      <section class="panel__group">
        <button class="lesson__toggle" id="lessonBtn" type="button">
          <span data-t="lessonTitle">小课堂：放大了，为什么看得更少？</span><i id="lessonArrow">▸</i>
        </button>
        <div class="lesson" id="lessonBody" hidden>
          <p class="lesson__intro" data-t="lessonText">目镜 10× 不变时，视野直径 = 18 mm ÷ 物镜倍数。4× 能看见 4.50 mm 的圈子，40× 只剩 0.45 mm。高倍焦深很窄，所以只能轻轻拧细准焦。</p>
        </div>
      </section>
    </div>
  </aside>

  <p class="foot-tip" id="footTip" data-t="footTip">拖空白转视角 · 右侧拧螺旋，左侧看目镜</p>

  <script type="module" src="main.js?v=387e0a72"></script>
</body>
</html>
