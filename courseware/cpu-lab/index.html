<body>
  <header class="bar">
    <a class="pill" href="../../index.html">← <span data-t="back">返回平台</span></a>
    <h1 class="bar__title">🖥️ <span data-t="title">电脑原理实验室</span></h1>
    <div class="bar__actions">
      <button class="pill pill--icon" id="soundBtn" type="button" aria-label="关闭音效" aria-pressed="false">🔊</button>
      <button class="pill pill--icon" id="themeBtn" type="button" aria-label="切换主题">🌙</button>
      <button class="pill" id="langBtn" type="button">EN</button>
      <button class="pill pill--icon" id="resetBtn" type="button" aria-label="重新开始">↻</button>
    </div>
  </header>

  <main class="lab">
    <section class="mission" aria-labelledby="missionTitle">
      <div class="mission__meta">
        <nav class="dots" id="levelDots" aria-label="关卡"></nav>
        <strong class="mission__chip" id="phaseChip">1 / 3</strong>
      </div>
      <p class="mission__label" id="watchLabel">第 1 关</p>
      <h2 class="mission__title" id="missionTitle">数字和命令放在哪里？</h2>
      <p class="mission__cue" id="missionCue">点正确的零件</p>
    </section>

    <section class="arena" id="arena" aria-live="polite"></section>

    <section class="dock">
      <p class="dock__prompt" id="prompt" role="status">👉 点零件回答</p>
      <div class="dock__row" id="dockRow">
        <button class="btn btn--primary" id="actionBtn" type="button" hidden>
          <span aria-hidden="true">👉</span>
          <span id="actionLabel">下一步</span>
        </button>
      </div>
      <div class="choice-row" id="choiceRow" hidden></div>
    </section>
  </main>

  <div class="bubble" id="hintBubble" hidden role="status">💡</div>
  <div class="fx-layer" id="fxLayer" aria-hidden="true"></div>

  <div class="modal" id="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle" hidden>
    <section class="modal-card" id="modalCard">
      <div class="modal-magic" id="modalMagic" aria-hidden="true">🖥️✨</div>
      <p class="modal-kicker" data-t="watchPassed">太棒了</p>
      <h2 id="modalTitle">零件都找到啦！</h2>
      <div class="modal-body" id="modalBody"></div>
      <button class="btn btn--primary" id="nextBtn" type="button">下一关</button>
    </section>
  </div>

  <script src="main.js?v=798f9ad3"></script>
</body>
</html>
