<html lang="zh-CN" data-theme="light">
<head>

  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>图形裁缝铺 · KidsLab</title>

</head>
<body>
  <div class="atelier" aria-hidden="true">
    <i></i><i></i><i></i>
  </div>

  <header class="topbar">
    <a class="pill pill--back" href="../../index.html">← <span data-t="back">返回平台</span></a>
    <h1><span aria-hidden="true">✂️</span> <span data-t="title">图形裁缝铺</span></h1>
    <div class="topbar__actions">
      <button class="pill pill--icon" id="soundBtn" type="button" aria-label="关闭声音" aria-pressed="false">🔊</button>
      <button class="pill pill--icon" id="themeBtn" type="button" aria-label="切换主题">🌙</button>
      <button class="pill pill--lang" id="langBtn" type="button">EN</button>
    </div>
  </header>

  <main class="shop" id="course">
    <section class="mission-card">
      <div class="mission-card__number">
        <small data-t="mission">订单</small>
        <strong id="missionNumber">1</strong>
        <span>/3</span>
      </div>
      <div class="mission-card__copy">
        <p id="missionKicker">客人来了 · 平行四边形布</p>
        <h2 id="missionTitle">只会给长方形报价</h2>
        <p id="missionPrompt" hidden>裁一刀，把斜角挪到另一头，变成好算的长方形。</p>
      </div>
      <nav class="mission-nav" id="missionNav" aria-label="订单进度"></nav>
    </section>

    <section class="workspace">
      <section class="stage" id="stage" data-phase="ready" data-result="idle">
        <div class="stage__head">
          <p id="stageLabel">裁剪台</p>
          <span class="price-pill">
            <small data-t="priceTag">报价</small>
            <strong id="priceValue">—</strong>
          </span>
        </div>
        <canvas id="sceneCanvas" aria-label="裁缝铺裁剪台"></canvas>
        <div class="readouts">
          <span><small data-t="shapeLabel">布料</small><strong id="shapeReadout">平行四边形</strong></span>
          <span><small data-t="baseLabel">底</small><strong id="baseReadout">8</strong></span>
          <span><small data-t="heightLabel">高</small><strong id="heightReadout">5</strong></span>
          <span><small data-t="areaLabel">面积</small><strong id="areaReadout">?</strong></span>
        </div>
        <div class="glow-seal" id="glowSeal" hidden>
          <span aria-hidden="true">🧵</span>
          <b id="sealText">拼成长方形啦</b>
        </div>
      </section>

      <aside class="console">
        <div class="console__head">
          <div>
            <small data-t="console">台账</small>
            <h3 id="controlTitle">先裁，再拼</h3>
          </div>
          <span class="console__badge" aria-hidden="true">🪡</span>
        </div>

        <p class="status" id="status" role="status" aria-live="polite">动手裁一刀。</p>

        <section class="formula-card" id="formulaCard" hidden>
          <span data-t="think">墙上公式</span>
          <strong id="formulaText">先变成会算的图形</strong>
        </section>

        <ol class="steps" id="stepsList" aria-label="步骤"></ol>

        <section class="stepper-card" id="quoteCard" hidden>
          <span id="stepperLabel">这块布的面积是？</span>
          <div class="stepper">
            <button id="minusBtn" type="button" aria-label="减少">−</button>
            <output id="guessValue" for="minusBtn plusBtn">30</output>
            <button id="plusBtn" type="button" aria-label="增加">+</button>
          </div>
          <small id="unitLabel">平方厘米</small>
        </section>

        <div class="hint-card" id="hintCard" hidden>
          <span aria-hidden="true">🧵</span>
          <p id="lessonText">割下来的角平移到另一头，面积一点不少。</p>
        </div>

        <div class="actions">
          <button class="secondary-btn" id="hintBtn" type="button"><span aria-hidden="true">💡</span> <span data-t="hint">给我一点提示</span></button>
          <button class="primary-btn" id="cutBtn" type="button"><span data-t="cut">剪刀开剪</span> <span aria-hidden="true">✂️</span></button>
          <button class="primary-btn" id="slideBtn" type="button" hidden><span data-t="slide">平移拼合</span> <span aria-hidden="true">➜</span></button>
          <button class="primary-btn" id="quoteBtn" type="button" hidden><span data-t="quote">确认报价</span> <span aria-hidden="true">💰</span></button>
          <button class="primary-btn" id="nextBtn" type="button" hidden><span id="nextLabel">下一位客人</span> <span aria-hidden="true">➜</span></button>
        </div>
        <button class="reset-btn" id="resetBtn" type="button" data-t="reset">收回这块布重裁</button>
      </aside>
    </section>
  </main>

  <div class="finale" id="finale" hidden>
    <canvas id="finaleCanvas" aria-hidden="true"></canvas>
    <section class="finale__card" role="dialog" aria-modal="true" aria-labelledby="finalTitle">
      <div class="finale__badge" aria-hidden="true">🧵</div>
      <p data-t="finalKicker">三种布料，一张转化族谱</p>
      <h2 id="finalTitle" data-t="finalTitle">你剪出了面积公式墙！</h2>
      <p data-t="finalText">平行四边形变长方形，两块三角形拼平行四边形，梯形割补后也回到底×高——面积在剪刀下显形。</p>
      <div class="finale__grid" id="finaleGrid"></div>
      <button class="primary-btn" id="playAgainBtn" type="button" data-t="playAgain">再开一铺</button>
    </section>
  </div>

  <script src="main.js?v=7fbd5cd8"></script>
</body>
</html>
