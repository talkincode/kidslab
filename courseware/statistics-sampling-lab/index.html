<!doctype html>
<html lang="zh-CN" data-theme="light">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>📊 抽样统计实验室 · KidsLab</title>
  <!--
    THESIS: A 3D sampling bench, not a stats quiz.
    OWN-WORLD: KidsLab chunky pills, fullscreen Three.js mini-city, right-hand instrument panel.
    STORY: Draw people from four districts, read the mean, watch convenience stay stably wrong.
    FIRST VIEWPORT: City diorama + HUD chips + collapsible panel.
  -->
  <link rel="stylesheet" href="style.css?v=51c8a65d" />
  <script>
    (() => {
      try {
        const theme = localStorage.getItem('kidslab.theme')
          || (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
        const lang = localStorage.getItem('kidslab.lang')
          || (navigator.language && navigator.language.startsWith('zh') ? 'zh' : 'en');
        document.documentElement.dataset.theme = theme;
        document.documentElement.lang = lang === 'zh' ? 'zh-CN' : 'en';
      } catch { /* private mode */ }
    })();
  </script>
  <script type="importmap">
    { "imports": { "three": "./vendor/three.module.min.js" } }
  </script>
<link rel="icon" type="image/svg+xml" href="../../assets/favicon.svg">

</head>
<body>
  <canvas id="scene" aria-label="3D sampling city"></canvas>
  <p class="nogl" id="nogl" hidden data-t="nogl">浏览器暂时跑不了 3D 实验室，换一个新一点的浏览器再来观测吧。</p>

  <header class="bar">
    <a class="pill" href="../../index.html">← <span data-t="back">返回平台</span></a>
    <h1 class="bar__title">📊 <span data-t="title">抽样统计实验室</span></h1>
    <div class="bar__actions">
      <button class="pill pill--icon" id="musicBtn" type="button" aria-pressed="true">♫</button>
      <button class="pill pill--icon" id="soundBtn" type="button" aria-pressed="true">🔊</button>
      <button class="pill pill--icon" id="themeBtn" type="button">🌙</button>
      <button class="pill" id="langBtn" type="button">EN</button>
    </div>
  </header>

  <section class="hud" aria-label="live instruments">
    <div class="hud__chip"><span class="hud__label" data-t="hudMethod">方法</span><b id="methodVal">简单随机</b></div>
    <div class="hud__chip"><span class="hud__label" data-t="hudN">人数 n</span><b id="nVal">40</b></div>
    <div class="hud__chip"><span class="hud__label" data-t="hudMean">样本均数</span><b id="meanVal">—</b></div>
    <div class="hud__chip"><span class="hud__label" data-t="hudSe">标准误</span><b id="seVal">—</b></div>
  </section>

  <p class="coach" id="coach" data-t="tip0">先抽一份「便利样本」，看均值会不会总往一边歪</p>

  <aside class="panel" id="panel">
    <div class="panel__quick">
      <button class="btn btn--big" id="drawBtn" type="button">🎯 <span data-t="btnDraw">抽这一份</span></button>
      <div class="btnrow">
        <button class="btn btn--ghost btn--sm" id="recordBtn" type="button" data-t="btnRecord">记下这次</button>
        <button class="btn btn--ghost btn--sm" id="censusBtn" type="button" data-t="btnCensus">全市普查</button>
      </div>
      <div class="btnrow">
        <button class="btn btn--ghost btn--sm" id="resetBtn" type="button" data-t="btnReset">重新实验</button>
      </div>
      <p class="panel__note" id="feedback" data-t="feedbackIdle">换方法再抽几份，把点点记到表里。</p>
    </div>
    <button class="panel__handle" id="panelHandle" type="button" aria-expanded="true">
      <span data-t="panelTitle">抽样面板</span><i id="panelArrow">▾</i>
    </button>
    <div class="panel__body" id="panelBody">
      <section class="panel__group">
        <p class="panel__label" data-t="labMethod">抽样方法</p>
        <div class="methods">
          <button class="chip" type="button" id="methodSimple" data-method="simple" aria-pressed="true">简单随机</button>
          <button class="chip" type="button" id="methodStratified" data-method="stratified" aria-pressed="false">分层</button>
          <button class="chip" type="button" id="methodCluster" data-method="cluster" aria-pressed="false">整群</button>
          <button class="chip" type="button" id="methodConvenience" data-method="convenience" aria-pressed="false">便利</button>
        </div>
      </section>
      <section class="panel__group">
        <p class="panel__label"><span data-t="labN">样本人数</span><b id="nPanelVal" class="panel__val">40</b></p>
        <input type="range" id="nRange" min="8" max="80" step="4" value="40" />
      </section>
      <section class="panel__group">
        <p class="panel__label" data-t="chartTitle">样本均数图</p>
        <div class="chart" id="meanChart" aria-hidden="true"></div>
      </section>
      <section class="panel__group">
        <p class="panel__label" data-t="logTitle">观测记录</p>
        <table class="log-table">
          <thead>
            <tr>
              <th data-t="colMethod">方法</th>
              <th data-t="colN">n</th>
              <th data-t="colMean">均数</th>
            </tr>
          </thead>
          <tbody id="trialRows"></tbody>
        </table>
      </section>
      <section class="panel__group" id="completeCard" hidden>
        <p class="panel__note" id="conclusionStatus">便利抽样挤在市中心的短通勤里；分层抽样才靠近全市 30 分钟。</p>
      </section>
      <section class="panel__group">
        <button class="lesson__toggle" id="lessonBtn" type="button">
          <span data-t="lessonTitle">小课堂：为什么便利样本看起来很稳？</span><i id="lessonArrow">▸</i>
        </button>
        <div class="lesson" id="lessonBody" hidden>
          <p class="lesson__intro" data-t="lessonText">市中心的人通勤都差不多，所以便利样本的点挤成一团。挤得紧只说明波动小，不说明它打中全市均值。分层会从四个街区都抓人，均值才会靠近普查线。</p>
        </div>
      </section>
    </div>
  </aside>

  <p class="foot-tip" id="footTip" data-t="footTip">拖空白转视角 · 右侧换抽样方法，左侧看谁被点亮</p>

  <script type="module" src="main.js?v=50531469"></script>
</body>
</html>
