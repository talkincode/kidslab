</head>
<body>
  <canvas id="scene" aria-label="3D 酸碱观测实验台"></canvas>
  <p class="nogl" id="nogl" hidden data-t="nogl">浏览器暂不支持 WebGL，请用右侧读数继续观察。</p>

  <header class="bar">
    <a class="pill" href="../../index.html">← <span data-t="back">返回平台</span></a>
    <h1 class="bar__title">🧪 <span data-t="title">酸碱魔法水</span></h1>
    <div class="bar__actions">
      <button class="pill pill--icon" id="soundBtn" type="button" aria-pressed="false" aria-label="关闭声音">🔊</button>
      <button class="pill pill--icon" id="themeBtn" type="button" aria-label="切换主题">🌙</button>
      <button class="pill" id="langBtn" type="button">EN</button>
    </div>
  </header>

  <section class="hud" aria-label="pH 读数">
    <div class="hud__chip"><span class="hud__label" data-t="hudPh">pH</span><b id="phVal">7.0</b></div>
    <div class="hud__chip"><span class="hud__label" data-t="hudGrade">教学分级</span><b id="phTag">中性</b></div>
    <div class="hud__chip"><span class="hud__label" data-t="hudSample">样品</span><b id="sampleName">纯水</b></div>
  </section>

  <div class="coach" id="coach" role="status" aria-live="polite">
    <span class="coach__icon">◎</span>
    <b id="coachLine">换一杯水，看看颜色怎么变</b>
  </div>

  <aside class="panel" id="panel">
    <div class="panel__quick">
      <button class="btn btn--big" id="dropBtn" type="button"><span data-t="drop">滴入指示剂</span></button>
    </div>
    <button class="panel__handle" id="panelHandle" type="button" aria-expanded="true">
      <span data-t="panelTitle">观测台</span><i id="panelArrow">▾</i>
    </button>
    <div class="panel__body" id="panelBody">
      <section class="panel__group">
        <p class="panel__label" data-t="secSub">换一杯新样品</p>
        <div class="subs" id="subs"></div>
        <p class="panel__hint" data-t="subHint">每次都是新的一杯，不会和上一杯混合。</p>
      </section>

      <section class="panel__group">
        <p class="panel__label" data-t="secPh">拧一拧 pH</p>
        <div class="ph-slider">
          <input id="phRange" type="range" min="0" max="14" step="0.1" value="7" aria-valuemin="0" aria-valuemax="14">
          <div class="ph-scale" aria-hidden="true"></div>
          <div class="ph-ends"><span data-t="acid">← 酸性</span><span data-t="base">碱性 →</span></div>
        </div>
      </section>

      <section class="panel__group">
        <p class="panel__label" data-t="secInd">换一种指示剂</p>
        <div class="inds" id="inds"></div>
      </section>

      <details class="fold" id="noteFold">
        <summary data-t="foldNotes">指示剂怎么变色</summary>
        <p class="panel__hint" id="indNote"></p>
      </details>
      <details class="fold" id="formulaFold">
        <summary data-t="foldFormula">稀溶液估算</summary>
        <p class="panel__hint" id="hIon"></p>
        <p class="panel__hint" data-t="formulaHint">这是示意估算，不是精确活度。</p>
      </details>
      <details class="fold" id="scopeFold">
        <summary data-t="foldScope">这是什么模型</summary>
        <p class="panel__hint" data-t="scopeNote">约 25 °C 的常见稀水溶液教学模型；样品 pH 与颜色都是示意。</p>
      </details>
      <details class="fold" id="safetyFold">
        <summary data-t="foldSafety">安全提示</summary>
        <p class="safety" data-t="safety">仅为虚拟模拟。现实中切勿混合漂白水与氨水、食醋、柠檬汁或其他清洁剂。</p>
      </details>
    </div>
  </aside>

  <p class="foot-tip" data-t="footTip">拖空白转视角 · 滚轮缩放 · 点瓶子换样品 · 点烧杯滴指示剂</p>
  <script type="module" src="main.js?v=07029651"></script>
</body>
</html>
