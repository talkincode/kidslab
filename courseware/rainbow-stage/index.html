  <link rel="icon" type="image/svg+xml" href="../../assets/favicon.svg">

</head>
<body>
  <header class="bar">
    <a class="pill pill--back" href="../../index.html">← <span data-t="back">返回平台</span></a>
    <h1><span aria-hidden="true">🌈</span> <span data-t="title">彩虹舞台</span></h1>
    <div class="bar__actions">
      <button class="pill pill--icon" id="soundBtn" type="button" aria-label="关闭声音" aria-pressed="false">🔊</button>
      <button class="pill pill--icon" id="themeBtn" type="button" aria-label="切换主题">🌙</button>
      <button class="pill pill--lang" id="langBtn" type="button">EN</button>
    </div>
  </header>

  <main class="course">
    <section class="mission card">
      <div class="mission__badge" aria-hidden="true"><small>ACT</small><strong id="missionNumber">01</strong></div>
      <div class="mission__copy">
        <p id="missionKicker">第一幕 · 加色灯光</p>
        <h2 id="missionTitle">把三束色光叠成白色</h2>
        <p id="missionText">点亮红、绿、蓝聚光灯，让三束光在主唱脚下重合。</p>
      </div>
      <nav class="mission-nav" id="missionNav" aria-label="舞台任务"></nav>
    </section>

    <section class="workspace">
      <section class="stage card">
        <div class="stage__hud">
          <p class="status" id="status" role="status" aria-live="polite">先点亮一盏聚光灯，看看颜色怎样叠加。</p>
          <div class="live-sign" aria-hidden="true"><i></i><span>LIVE</span></div>
        </div>
        <div class="canvas-shell" id="canvasShell">
          <canvas id="stageCanvas" aria-label="彩虹舞台实验画面"></canvas>
          <div class="result-card" aria-live="polite">
            <span id="resultLabel">舞台光色</span>
            <strong id="resultName">黑暗</strong>
            <small id="resultFormula">R 0 · G 0 · B 0</small>
          </div>
        </div>
      </section>

      <aside class="console card">
        <div class="console__head">
          <div>
            <p id="consoleKicker">LIGHT DESK / 灯光台</p>
            <strong id="consoleTitle">三色聚光灯</strong>
          </div>
          <span class="crew-pass" aria-hidden="true">CREW</span>
        </div>

        <section class="control-panel" id="lightPanel">
          <p class="control-label" data-t="chooseLights">点亮色光</p>
          <div class="light-controls">
            <button class="color-btn color-btn--red" data-light="red" type="button" aria-pressed="false"><i></i><span data-t="redLight">红光</span></button>
            <button class="color-btn color-btn--green" data-light="green" type="button" aria-pressed="false"><i></i><span data-t="greenLight">绿光</span></button>
            <button class="color-btn color-btn--blue" data-light="blue" type="button" aria-pressed="false"><i></i><span data-t="blueLight">蓝光</span></button>
          </div>
          <div class="target"><span data-t="target">演出目标</span><b data-t="lightTarget">用三盏灯做出白光</b></div>
        </section>

        <section class="control-panel" id="paintPanel" hidden>
          <p class="control-label" data-t="choosePigments">倒入颜料</p>
          <div class="paint-controls">
            <button class="paint-btn paint-btn--cyan" data-pigment="cyan" type="button" aria-pressed="false"><i></i><span data-t="cyanPaint">青色</span></button>
            <button class="paint-btn paint-btn--yellow" data-pigment="yellow" type="button" aria-pressed="false"><i></i><span data-t="yellowPaint">黄色</span></button>
            <button class="paint-btn paint-btn--magenta" data-pigment="magenta" type="button" aria-pressed="false"><i></i><span data-t="magentaPaint">品红</span></button>
          </div>
          <button class="reset-link" id="clearPaintBtn" type="button" data-t="clearPaint">清空调色桶</button>
          <div class="target"><span data-t="target">演出目标</span><b data-t="paintTarget">只用两种颜料调出绿色</b></div>
        </section>

        <section class="control-panel" id="prismPanel" hidden>
          <label for="prismSlider">
            <span data-t="prismAngle">棱镜角度</span>
            <strong id="prismAngleLabel">偏左</strong>
          </label>
          <input id="prismSlider" type="range" min="1" max="5" step="1" value="1" />
          <div class="range-labels" aria-hidden="true"><span data-t="left">左</span><span data-t="right">右</span></div>
          <button class="action action--shine" id="shineBtn" type="button"><span aria-hidden="true">✦</span> <span data-t="shine">打开白光</span></button>
          <div class="target"><span data-t="target">演出目标</span><b data-t="prismTarget">让整条彩虹落进幕布框</b></div>
        </section>

        <div class="lesson-card">
          <span aria-hidden="true" id="lessonIcon">＋</span>
          <p id="lessonText">色光越叠越亮；红、绿、蓝三束光能一起组成白光。</p>
        </div>

        <div class="console__actions">
          <button class="secondary" id="hintBtn" type="button"><span aria-hidden="true">💡</span> <span data-t="hint">轻提示</span></button>
          <button class="action action--check" id="checkBtn" type="button"><span aria-hidden="true">✓</span> <span data-t="check">检查演出</span></button>
          <button class="action action--next" id="nextBtn" type="button" hidden><span data-t="next">下一幕</span> <span aria-hidden="true">→</span></button>
        </div>
      </aside>
    </section>
  </main>

  <div class="modal" id="completeModal" hidden>
    <section class="modal__card" role="dialog" aria-modal="true" aria-labelledby="completeTitle">
      <div class="rainbow-crown" aria-hidden="true"><i></i><i></i><i></i></div>
      <p data-t="finalKicker">三幕灯光实验全部完成</p>
      <h2 id="completeTitle" data-t="finalTitle">青蛙音乐节亮起来了！</h2>
      <p data-t="finalText">你用加色光合出白色，用减色颜料留下绿色，还把白光里藏着的彩虹展开了。</p>
      <button class="action action--check" id="playAgainBtn" type="button" data-t="playAgain">再办一场音乐节</button>
    </section>
  </div>

  <script src="main.js?v=35a69c1d"></script>
</body>
</html>
