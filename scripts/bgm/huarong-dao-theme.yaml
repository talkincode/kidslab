# 华容道课件循环配乐 · 「木门徐开」
# Palette decision: reject the default cinematic strings; use a compact
# pentatonic struck/plucked ensemble so the score feels like a wooden mechanism.
title: The Wooden Gate Opens
story: >
  A child studies a lacquered Huarong Dao on a quiet scholar's desk. Wooden
  pieces click into place, a path slowly opens, and careful planning feels
  curious rather than tense. Pentatonic, tactile, focused, and loop-safe.
tempo: 92
key: E_minor
time_signature: 6/8
bars: 16
loop: true

harmony: [i, VII, VI, v, i, III, iv, v]

performance:
  humanize: { timing_ms: 14, velocity: 8, seed: 20260726 }
  dynamics: { start: p, peak: mf }

