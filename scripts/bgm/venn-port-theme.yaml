# 维恩太空港循环配乐 · 「轨道海关夜班」
# Palette decision: reject the obvious slow synth-ambient score. A lunar-lounge
# jazz palette makes classification feel observant, precise, and quietly playful.
title: Orbital Customs Night Shift
story: >
  A child runs a retro-futurist orbital customs deck. Two holographic landing
  rings pulse with scanner telemetry while friendly ships queue beyond a planet's
  rim. Calm, clever, tactile, and loop-safe rather than cinematic or arcade-like.
tempo: 106
key: F_major
time_signature: 5/4
bars: 12
loop: true

harmony: [I, vi, IV, V, ii, vi, IV, V, I, iii, IV, V]

performance:
  humanize: { timing_ms: 18, velocity: 7, seed: 20260728 }
  swing: 0.22
  dynamics: { start: p, peak: mf }

